[project]
name = "numlang-studio"
version = "0.1.0"
description = "NumLang: a small math language and interactive spring-mass cloth simulator built on handwritten numerical methods."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Abdus Salam Gifari" },
    { name = "Nukhyai U Marma" },
]
keywords = ["numerical-methods", "runge-kutta", "newton-raphson", "gaussian-elimination", "automatic-differentiation", "cloth-simulation", "numba"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dearpygui>=2.3.1",
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numlang"]

[project.urls]
Repository = "https://github.com/gifari0017/NumLang-Studio"
